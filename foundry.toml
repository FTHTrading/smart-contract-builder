[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
cache_path = "cache"

solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200

# paris, not shanghai. Shanghai's PUSH0 is not universally supported on
# alt-L1s and older chain forks. Paris costs marginal gas and buys every
# chain that Unykorn Studio's chain selector supports.
evm_version = "paris"

# IPFS-hashed metadata enables Etherscan / Sourcify verification.
bytecode_hash = "ipfs"

via_ir = true

# Match Unykorn Studio's compile settings byte-for-byte. Contract bytecode
# compiled here is identical to what Studio's self-hosted WASM worker produces
# under the same input.

fs_permissions = [{ access = "read", path = "./"}]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"
quote_style = "double"
number_underscore = "thousands"

[fuzz]
runs = 1000
max_test_rejects = 262144
